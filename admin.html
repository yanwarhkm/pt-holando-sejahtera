<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — PT Kentang Holando Sejahtera</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1B5E20;
      --primary-light: #2E7D32;
      --accent: #F4B942;
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --text: #263238;
      --muted: #667085;
      --danger: #C62828;
      --success: #2E7D32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    .admin-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 25px 20px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-brand { display: flex; align-items: center; gap: 12px; }
    .admin-brand img { width: 45px; border-radius: 8px; }
    .admin-brand h1 { font-size: 1rem; }
    .admin-brand p { font-size: .75rem; opacity: .8; }
    .logout-btn {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logout-btn:hover { background: rgba(255,255,255,.3); }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }
    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .stat-label { font-size: .8rem; color: var(--muted); }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
      margin-bottom: 16px;
    }
    .card h3 { font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; font-weight: 700; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 2px;
      font-size: .75rem;
      font-weight: 600;
    }
    .status-pending { background: #FFF3E0; color: #E65100; }
    .status-done { background: #E8F5E9; color: #2E7D32; }
    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
      margin-right: 4px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--primary);
      text-decoration: none;
      font-size: .85rem;
    }
    .back-link i { margin-right: 6px; }
  </style>
</head>
<body>

<header class="admin-header">
  <div class="header-inner">
    <div class="admin-brand">
      <img src="WhatsApp Image 2026-09-08 at 11.19.26.jpeg" alt="Logo">
      <div>
        <h1>PT Kentang Holando Sejahtera</h1>
        <p>Panel Administrator — Beken Seeds</p>
      </div>
    </div>
    <button class="logout-btn" onclick="keluarAdmin()">
      <i class="fa-solid fa-right-from-bracket"></i> Keluar
    </button>
  </div>
</header>

<div class="container">
  <!-- Statistik -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon" style="background: #E8F5E9; color: #2E7D32;">
        <i class="fa-solid fa-users"></i>
      </div>
      <div class="stat-value" id="jumlahMitra">0</div>
      <div class="stat-label">Mitra Terdaftar</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: #FFF3E0; color: #E65100;">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
      <div class="stat-value" id="jumlahPesanan">0</div>
      <div class="stat-label">Total Pesanan</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: #E3F2FD; color: #1565C0;">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <div class="stat-value" id="jumlahPanduan">0</div>
      <div class="stat-label">Akses Panduan</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: #FCE4EC; color: #C2185B;">
        <i class="fa-solid fa-comment"></i>
      </div>
      <div class="stat-value" id="jumlahTestimoni">0</div>
      <div class="stat-label">Testimoni</div>
    </div>
  </div>

  <!-- Tab Menu -->
  <div class="tabs">
    <button class="tab-btn active" onclick="bukaTab('mitra')">
      <i class="fa-solid fa-users"></i> Data Mitra
    </button>
    <button class="tab-btn" onclick="bukaTab('pesanan')">
      <i class="fa-solid fa-clipboard-list"></i> Pesanan
    </button>
    <button class="tab-btn" onclick="bukaTab('panduan')">
      <i class="fa-solid fa-book"></i> Akses Panduan
    </button>
    <button class="tab-btn" onclick="bukaTab('testimoni')">
      <i class="fa-solid fa-comments"></i> Testimoni
    </button>
  </div>

  <!-- Tab: Mitra -->
  <div class="tab-content active" id="tab-mitra">
    <div class="card">
      <h3><i class="fa-solid fa-user-plus"></i> Daftar Mitra Pembudidaya</h3>
      <div id="daftarMitra"></div>
    </div>
  </div>

  <!-- Tab: Pesanan -->
  <div class="tab-content" id="tab-pesanan">
    <div class="card">
      <h3><i class="fa-solid fa-clipboard-check"></i> Daftar Pesanan</h3>
      <div id="daftarPesanan"></div>
    </div>
  </div>

  <!-- Tab: Panduan -->
  <div class="tab-content" id="tab-panduan">
    <div class="card">
      <h3><i class="fa-solid fa-unlock"></i> Daftar Pembeli Panduan Lengkap</h3>
      <div id="daftarPanduan"></div>
    </div>
  </div>

  <!-- Tab: Testimoni -->
  <div class="tab-content" id="tab-testimoni">
    <div class="card">
      <h3><i class="fa-solid fa-pen-to-square"></i> Daftar Testimoni</h3>
      <div id="daftarTestimoni"></div>
    </div>
  </div>

  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
</div>

<script>
// ==== CEK LOGIN ====
if (localStorage.getItem("adminSudahLogin") !== "ya") {
  alert("Silakan login terlebih dahulu!");
  window.location.href = "login.html";
}

// Keluar
function keluarAdmin() {
  if (confirm("Yakin ingin keluar?")) {
    localStorage.removeItem("adminSudahLogin");
    window.location.href = "login.html";
  }
}

// Ganti Tab
function bukaTab(namaTab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  event.target.closest(".tab-btn").classList.add("active");
  document.getElementById("tab-" + namaTab).classList.add("active");
}

// Tampilkan Data
function muatData() {
  // Mitra
  const mitra = JSON.parse(localStorage.getItem("daftarMitra") || "[]");
  document.getElementById("jumlahMitra").textContent = mitra.length;
  if (mitra.length === 0) {
    document.getElementById("daftarMitra").innerHTML = `<div class="empty-state">Belum ada mitra terdaftar.</div>`;
  } else {
    let html = `<table><tr><th>No</th><th>Nama</th><th>WhatsApp</th><th>Lokasi</th><th>Luas Lahan</th></tr>`;
    mitra.forEach((m, i) => {
      html += `<tr>
        <td>${i+1}</td>
        <td>${m.nama || "-"}</td>
        <td>${m.wa || "-"}</td>
        <td>${m.lokasi || "-"}</td>
        <td>${m.lahan || "-"} m²</td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById("daftarMitra").innerHTML = html;
  }

  // Pesanan
  const pesanan = JSON.parse(localStorage.getItem("daftarPesanan") || "[]");
  document.getElementById("jumlahPesanan").textContent = pesanan.length;
  if (pesanan.length === 0) {
    document.getElementById("daftarPesanan").innerHTML = `<div class="empty-state">Belum ada pesanan.</div>`;
  } else {
    let html = `<table><tr><th>No</th><th>Nama</th><th>WhatsApp</th><th>Total</th><th>Status</th></tr>`;
    pesanan.forEach((p, i) => {
      html += `<tr>
        <td>${i+1}</td>
        <td>${p.nama || "-"}</td>
        <td>${p.wa || "-"}</td>
        <td>${p.total || "-"}</td>
        <td><span class="status-badge status-pending">Baru</span></td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById("daftarPesanan").innerHTML = html;
  }

  // Akses Panduan
  const panduan = JSON.parse(localStorage.getItem("pembeliPanduan") || "[]");
  document.getElementById("jumlahPanduan").textContent = panduan.length;
  if (panduan.length === 0) {
    document.getElementById("daftarPanduan").innerHTML = `<div class="empty-state">Belum ada pembeli panduan.</div>`;
  } else {
    let html = `<table><tr><th>No</th><th>Waktu</th></tr>`;
    panduan.forEach((p, i) => {
      html += `<tr>
        <td>${i+1}</td>
        <td>${p.waktu || "-"}</td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById("daftarPanduan").innerHTML = html;
  }

  // Testimoni
  const testimoni = JSON.parse(localStorage.getItem("daftarTestimoni") || "[]");
  document.getElementById("jumlahTestimoni").textContent = testimoni.length;
  if (testimoni.length === 0) {
    document.getElementById("daftarTestimoni").innerHTML = `<div class="empty-state">Belum ada testimoni.</div>`;
  } else {
    let html = `<table><tr><th>No</th><th>Nama</th><th>Pesan</th></tr>`;
    testimoni.forEach((t, i) => {
      html += `<tr>
        <td>${i+1}</td>
        <td>${t.nama || "-"}</td>
        <td>${t.pesan || "-"}</td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById("daftarTestimoni").innerHTML = html;
  }
}

// Catat pembeli panduan
function catatPembeliPanduan() {
  const list = JSON.parse(localStorage.getItem("pembeliPanduan") || "[]");
  list.unshift({ waktu: new Date().toLocaleString("id-ID") });
  localStorage.setItem("pembeliPanduan", JSON.stringify(list));
}

// Jalankan saat dibuka
muatData();
</script>

</body>
</html>
