<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — PT Kentang Holando Sejahtera</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1B5E20;
      --primary-light: #2E7D32;
      --accent: #F4B942;
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --text: #263238;
      --muted: #667085;
      --danger: #C62828;
      --success: #2E7D32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    .admin-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 25px 20px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-brand { display: flex; align-items: center; gap: 12px; }
    .admin-brand img { width: 45px; border-radius: 8px; }
    .admin-brand h1 { font-size: 1rem; }
    .admin-brand p { font-size: .75rem; opacity: .8; }
    .logout-btn {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logout-btn:hover { background: rgba(255,255,255,.3); }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }
    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .stat-label { font-size: .8rem; color: var(--muted); }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
      margin-bottom: 16px;
    }
    .card h3 { font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; font-weight: 700; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 2px;
      font-size: .75rem;
      font-weight: 600;
    }
    .status-pending { background: #FFF3E0; color: #E65100; }
    .status-done { background: #E8F5E9; color: #2E7D32; }
    .status-process { background: #E3F2FD; color: #1565C0; }
    .status-cancel { background: #FFEBEE; color: #C62828; }
    .status-select { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: .8rem; margin-right: 4px; }
    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
      margin-right: 4px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--primary);
      text-decoration: none;
      font-size: .85rem;
    }
    .back-link i { margin-right: 6px; }
  </style>
</head>
<body>

<header class="admin-header">
  <div class="header-inner">
    <div class="admin-brand">
      <img src="WhatsApp Image 2026-09-08 at 11.19.26.jpeg" alt="Logo">
      <div>
        <h1>PT Kentang Holando Sejahtera</h1>
        <p>Panel Administrator — Beken Seeds</p>
      </div>
    </div>
    <button class="logout-btn" onclick="keluarAdmin()">
      <i class="fa-solid fa-right-from-bracket"></i> Keluar
    </button>
  </div>
</header>

<div class="container">
  <!-- Statistik -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon" style="background: #E8F5E9; color: #2E7D32;">
        <i class="fa-solid fa-users"></i>
      </div>
      <div class="stat-value" id="jumlahMitra">0</div>
      <div class="stat-label">Mitra Terdaftar</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: #FFF3E0; color: #E65100;">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
      <div class="stat-value" id="jumlahPesanan">0</div>
      <div class="stat-label">Total Pesanan</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: #E3F2FD; color: #1565C0;">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <div class="stat-value" id="jumlahPanduan">0</div>
      <div class="stat-label">Akses Panduan</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: #FCE4EC; color: #C2185B;">
        <i class="fa-solid fa-comment"></i>
      </div>
      <div class="stat-value" id="jumlahTestimoni">0</div>
      <div class="stat-label">Testimoni</div>
    </div>
  </div>

  <!-- Tab Menu -->
  <div class="tabs">
    <button class="tab-btn active" onclick="bukaTab('mitra')">
      <i class="fa-solid fa-users"></i> Data Mitra
    </button>
    <button class="tab-btn" onclick="bukaTab('pesanan')">
      <i class="fa-solid fa-clipboard-list"></i> Pesanan
    </button>
    <button class="tab-btn" onclick="bukaTab('panduan')">
      <i class="fa-solid fa-book"></i> Akses Panduan
    </button>
    <button class="tab-btn" onclick="bukaTab('testimoni')">
      <i class="fa-solid fa-comments"></i> Testimoni
    </button>
  </div>

  <!-- Tab: Mitra -->
  <div class="tab-content active" id="tab-mitra">
    <div class="card">
      <h3><i class="fa-solid fa-user-plus"></i> Daftar Mitra Pembudidaya</h3>
      <div id="daftarMitra"></div>
    </div>
  </div>

  <!-- Tab: Pesanan -->
  <div class="tab-content" id="tab-pesanan">
    <div class="card">
      <h3><i class="fa-solid fa-clipboard-check"></i> Daftar Pesanan</h3>
      <div id="daftarPesanan"></div>
    </div>
  </div>

  <!-- Tab: Panduan -->
  <div class="tab-content" id="tab-panduan">
    <div class="card">
      <h3><i class="fa-solid fa-unlock"></i> Daftar Pembeli Panduan Lengkap</h3>
      <div id="daftarPanduan"></div>
    </div>
  </div>

  <!-- Tab: Testimoni -->
  <div class="tab-content" id="tab-testimoni">
    <div class="card">
      <h3><i class="fa-solid fa-pen-to-square"></i> Daftar Testimoni</h3>
      <div id="daftarTestimoni"></div>
    </div>
  </div>

  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
</div>

<script src="js/api.js"></script>
<script>
// ==== CEK LOGIN ====
// Sesi diverifikasi server; semua data di halaman ini diambil dari API yang
// menolak request tanpa sesi admin (401).
function keLogin() {
  window.location.href = "login.html";
}

// Keluar
async function keluarAdmin() {
  if (confirm("Yakin ingin keluar?")) {
    try {
      await apiRequest("api/auth.php", { method: "POST", body: { action: "logout" } });
    } catch (e) {
      // Tetap arahkan ke login walaupun request gagal
    }
    keLogin();
  }
}

// Ganti Tab
function bukaTab(namaTab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  event.target.closest(".tab-btn").classList.add("active");
  document.getElementById("tab-" + namaTab).classList.add("active");
}

const STATUS_PESANAN = {
  baru: { label: "Baru", kelas: "status-pending" },
  diproses: { label: "Diproses", kelas: "status-process" },
  selesai: { label: "Selesai", kelas: "status-done" },
  batal: { label: "Batal", kelas: "status-cancel" }
};
const TRANSISI_STATUS = { baru: ["diproses", "batal"], diproses: ["selesai", "batal"], selesai: [], batal: [] };

function tampilkanStatus(id, teks, gagal = false) {
  document.getElementById(id).innerHTML =
    `<div class="empty-state"${gagal ? ' style="color:var(--danger);"' : ''}>${escapeHTML(teks)}</div>`;
}

// Tampilkan Data
function renderMitra(mitra) {
  document.getElementById("jumlahMitra").textContent = mitra.length;
  if (mitra.length === 0) {
    tampilkanStatus("daftarMitra", "Belum ada mitra terdaftar.");
    return;
  }
  let html = `<table><tr><th>No</th><th>Nama</th><th>WhatsApp</th><th>Lokasi</th><th>Luas Lahan</th><th>Aksi</th></tr>`;
  mitra.forEach((m, i) => {
    html += `<tr>
      <td>${i+1}</td>
      <td>${escapeHTML(m.nama)}</td>
      <td>${escapeHTML(m.wa)}</td>
      <td>${escapeHTML(m.lokasi)}</td>
      <td>${Number(m.lahan).toLocaleString("id-ID")} m²</td>
      <td><button class="btn btn-danger" data-label="mitra ${escapeHTML(m.nama)}" onclick="hapusData('mitra', ${m.id}, this)"><i class="fa-solid fa-trash"></i></button></td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById("daftarMitra").innerHTML = html;
}

function renderPesanan(pesanan) {
  document.getElementById("jumlahPesanan").textContent = pesanan.length;
  if (pesanan.length === 0) {
    tampilkanStatus("daftarPesanan", "Belum ada pesanan.");
    return;
  }
  let html = `<table><tr><th>No</th><th>Kode</th><th>Nama</th><th>WhatsApp</th><th>Total</th><th>Status</th><th>Aksi</th></tr>`;
  pesanan.forEach((p, i) => {
    const status = STATUS_PESANAN[p.status] || STATUS_PESANAN.baru;
    const rincian = p.items.map(it => `${it.nama} × ${it.jumlah}`).join(", ");
    // Hanya status saat ini + transisi yang diizinkan server (api/pesanan.php)
    const pilihan = [p.status, ...(TRANSISI_STATUS[p.status] || [])].map(nilai =>
      `<option value="${nilai}"${nilai === p.status ? " selected" : ""}>${STATUS_PESANAN[nilai].label}</option>`).join("");
    html += `<tr>
      <td>${i+1}</td>
      <td title="${escapeHTML(formatTanggal(p.created_at, true))}">${escapeHTML(p.kode_pesanan)}</td>
      <td title="${escapeHTML(p.alamat)}">${escapeHTML(p.nama)}</td>
      <td>${escapeHTML(p.wa)}</td>
      <td title="${escapeHTML(rincian)}">${formatRupiah(p.total)}</td>
      <td><span class="status-badge ${status.kelas}">${status.label}</span></td>
      <td style="white-space:nowrap;">
        <select class="status-select" onchange="ubahStatusPesanan(${p.id}, this)">${pilihan}</select>
        <button class="btn btn-danger" data-label="pesanan ${escapeHTML(p.kode_pesanan)}" onclick="hapusData('pesanan', ${p.id}, this)"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById("daftarPesanan").innerHTML = html;
}

function renderPanduan(panduan) {
  document.getElementById("jumlahPanduan").textContent = panduan.length;
  if (panduan.length === 0) {
    tampilkanStatus("daftarPanduan", "Belum ada pembeli panduan.");
    return;
  }
  let html = `<table><tr><th>No</th><th>Waktu</th><th>No. Pesanan</th><th>Halaman</th></tr>`;
  panduan.forEach((p, i) => {
    html += `<tr>
      <td>${i+1}</td>
      <td>${escapeHTML(formatTanggal(p.created_at, true))}</td>
      <td>${escapeHTML(p.kode_pesanan || "-")}</td>
      <td>${p.sumber === "panduan-kentang" ? "Panduan Kentang" : "Beranda"}</td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById("daftarPanduan").innerHTML = html;
}

function renderTestimoni(testimoni) {
  document.getElementById("jumlahTestimoni").textContent = testimoni.length;
  if (testimoni.length === 0) {
    tampilkanStatus("daftarTestimoni", "Belum ada testimoni.");
    return;
  }
  let html = `<table><tr><th>No</th><th>Nama</th><th>Pesan</th><th>Status</th><th>Aksi</th></tr>`;
  testimoni.forEach((t, i) => {
    html += `<tr>
      <td>${i+1}</td>
      <td>${escapeHTML(t.nama)}</td>
      <td>${escapeHTML(t.pesan)}</td>
      <td><span class="status-badge ${t.tampil ? "status-done" : "status-pending"}">${t.tampil ? "Tampil" : "Menunggu"}</span></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-primary" onclick="ubahTampilTestimoni(${t.id}, ${!t.tampil}, this)">
          <i class="fa-solid ${t.tampil ? "fa-eye-slash" : "fa-eye"}"></i> ${t.tampil ? "Sembunyikan" : "Tampilkan"}
        </button>
        <button class="btn btn-danger" data-label="testimoni dari ${escapeHTML(t.nama)}" onclick="hapusData('testimoni', ${t.id}, this)"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById("daftarTestimoni").innerHTML = html;
}

const SUMBER_DATA = [
  { url: "api/mitra.php", wadah: "daftarMitra", render: renderMitra },
  { url: "api/pesanan.php", wadah: "daftarPesanan", render: renderPesanan },
  { url: "api/panduan.php", wadah: "daftarPanduan", render: renderPanduan },
  { url: "api/testimoni.php?semua=1", wadah: "daftarTestimoni", render: renderTestimoni }
];

async function muatData() {
  const hasil = await Promise.allSettled(SUMBER_DATA.map(s => apiRequest(s.url)));
  if (hasil.some(h => h.status === "rejected" && h.reason.status === 401)) {
    alert("Silakan login terlebih dahulu!");
    keLogin();
    return;
  }
  hasil.forEach((h, i) => {
    const sumber = SUMBER_DATA[i];
    if (h.status === "fulfilled") sumber.render(h.value.data);
    else tampilkanStatus(sumber.wadah, "Gagal memuat data: " + h.reason.message, true);
  });
}

// Jalankan PUT/DELETE lalu muat ulang tabel
async function jalankanAksi(aksi, elemen) {
  if (elemen) elemen.disabled = true;
  try {
    await aksi();
    await muatData();
  } catch (err) {
    if (err.status === 401) return keLogin();
    alert(err.message);
    if (elemen) elemen.disabled = false;
  }
}

function ubahStatusPesanan(id, select) {
  jalankanAksi(() => apiRequest(`api/pesanan.php?id=${id}`, { method: "PUT", body: { status: select.value } }), select);
}

function ubahTampilTestimoni(id, tampil, tombol) {
  jalankanAksi(() => apiRequest(`api/testimoni.php?id=${id}`, { method: "PUT", body: { tampil } }), tombol);
}

function hapusData(jenis, id, tombol) {
  if (!confirm(`Hapus ${tombol.dataset.label}?`)) return;
  jalankanAksi(() => apiRequest(`api/${jenis}.php?id=${id}`, { method: "DELETE" }), tombol);
}

// Jalankan saat dibuka
SUMBER_DATA.forEach(s => tampilkanStatus(s.wadah, "Memuat data..."));
muatData();
</script>

</body>
</html>
